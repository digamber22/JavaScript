<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai aur code | DOM</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    function addLanguage(langName){
        const li = document.createElement('li');
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li)
    }
    addLanguage("python")
    addLanguage("typescript")

    // this is optimize way , in above method tree travel every time, so need to optimize ;
    function addOptiLanguage(langName){
        const list = document.createElement('li');
        let addText = document.createTextNode(langName);
        list.appendChild(addText);
        document.querySelector('.language').appendChild(list)
    }
    addOptiLanguage('golang');

    //Edit
    const secondLang = document.querySelector("li:nth-child(2)")  
    console.log(secondLang);
    //secondLang.innerHTML = "Mojo"      // method 1 

    const newli = document.createElement('li')  // method 2 (most prefer) , // newli work as reference
    newli.textContent = "Mojo"
    secondLang.replaceWith(newli)

    // edit         // this is also method for edit ;
    // const firstLang = document.querySelector("li:first-child")
    // firstLang.outerHTML = '<li>TypeScript</li>' 

    // //remove
    // const lastLang = document.querySelector('li:last-child')

</script>
</html>
