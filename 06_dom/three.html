<script>
 // creating the document using script tag;  using  create , setattribute, appending things in body ;
      // Function to create and append a div with given text
      let createfunction = function creatediv(text) {
        const div = document.createElement('div');
        div.className = "main";
        div.id = Math.round(Math.random() * 10 + 1);
        div.setAttribute("title", "generated title");
        div.style.backgroundColor = "green";
        div.style.padding = "12px";

        const addText = document.createTextNode(text);
        div.appendChild(addText);

        "chai aur code",
